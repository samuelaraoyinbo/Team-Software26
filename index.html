<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CU Portal | Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-screen">

    <!-- LEFT PANEL: image + watermark + welcome text -->
    <section class="image-panel" aria-hidden="true">
      <div class="image-panel__overlay"></div>

      <div class="image-panel__watermark">
        <svg viewBox="0 0 200 200" width="220" height="220" role="img" aria-label="CU watermark">
          <text x="100" y="140" text-anchor="middle" class="watermark-text">CU</text>
        </svg>
      </div>

      <div class="image-panel__caption">
        <p class="caption-line caption-line--bold">
          <span class="caption-strong">CU Portal</span> | Welcome back.
        </p>
        <p class="caption-line">Log in to access your world...</p>
      </div>
    </section>

    <!-- RIGHT PANEL: form -->
    <section class="form-panel">
      <div class="form-wrap">

        <header class="brand-row">
          <div class="brand-badge" aria-hidden="true">
            <svg viewBox="0 0 60 60" width="52" height="52">
              <circle cx="30" cy="30" r="27" fill="#ffffff" stroke="#3FAE4A" stroke-width="2.5" />
              <text x="30" y="36" text-anchor="middle" class="badge-text">CU</text>
            </svg>
          </div>
          <div class="brand-divider" aria-hidden="true"></div>
          <div class="brand-wordmark">
            <span class="brand-line brand-line--top">Covenant</span>
            <span class="brand-line brand-line--bottom">University</span>
            <span class="brand-tagline">Africa's No. 1 Private University</span>
          </div>
        </header>

        <h1 class="form-title">Sign In</h1>
        <p class="form-subtitle">Access your academic portal</p>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="username" class="field-label">Username</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
                </svg>
              </span>
              <input
                type="text"
                id="username"
                name="username"
                class="input-field"
                placeholder="Type your username here..."
                autocomplete="username"
                aria-describedby="usernameError"
              />
            </div>
            <p class="error-message" id="usernameError" role="alert"></p>
          </div>

          <div class="field">
            <label for="password" class="field-label">Password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="input-field"
                placeholder="Type your password here..."
                autocomplete="current-password"
                aria-describedby="passwordError"
              />
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-slash" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" hidden>
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.61 3.35M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <p class="error-message" id="passwordError" role="alert"></p>

            <p class="warning-row">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 2 1 21h22L12 2Z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              Passwords are CASE SENSITIVE
            </p>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <span class="login-btn__text">Login</span>
          </button>

          <div class="utility-row">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span class="checkbox-box" aria-hidden="true"></span>
              <span>Remember me</span>
            </label>
            <a href="#" class="link forgot-link">Forgot password?</a>
          </div>

          <p class="support-row">
            Trouble signing in? <a href="#" class="link">Contact IT</a> Support
          </p>
        </form>
      </div>

      <footer class="form-footer">
        <p>&copy; 2026 Covenant University. All rights reserved.</p>
      </footer>
    </section>

  </main>
</body>
</html>
